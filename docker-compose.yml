services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adani-tracking-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://admin:password@cluster0.mongodb.net/?retryWrites=true&w=majority}
      - DATABASE_NAME=${DATABASE_NAME:-adani_smart_meter_db}
      - JWT_SECRET=${JWT_SECRET:-adani-smart-meter-production-grade-jwt-secret-key-987654321}
      - MAPPLS_API_KEY=${MAPPLS_API_KEY:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000,http://localhost:5173}
    networks:
      - adani-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000/api
        - VITE_MAPPLS_API_KEY=${MAPPLS_API_KEY:-}
    container_name: adani-tracking-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - adani-network

networks:
  adani-network:
    driver: bridge
